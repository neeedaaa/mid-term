<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>دیجی نیوز</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <img class="hero-bg" src="./assets/images/bg.svg" alt="">


        <div class="container header-content">

            <div class="right">
                <img src="./assets/images/Vector.png" alt="">
                <span class="logo">دیجی نیوز</span>
            </div>

            <div class="left">
                <button class="btn outline">وارد شوید</button>
                <button class="btn primary">ثبت نام</button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">

        <div class="container hero-content">
            <img src="./assets/images/content.image.png" alt="">

            <h1>به دیجی نیوز خوش آمدید</h1>

            <p>اینجا جدیدترین مطالب حوزه تکنولوژی قرار داده می‌شود</p>

            <div class="categories">
                <div class="cat">
                    <button class="category">موبایل</button>
                    <button class="category">کامپیوتر</button>
                    <button class="category">سخت افزار</button>
                    <button class="category">سیستم عامل</button>
                    <button class="category">بررسی ویدیویی</button>
                    <button class="category active">مشاهده همه</button>
                </div>
            </div>
        </div>
    </section>


    <div class="card">
        <img class="photo" src="./assets/images/card-image.png" alt="">
        <img class="arrow1" src="./assets/images/Arrow - Down Square (1).svg" alt="">
        <div class="right-info">
            <img src="./assets/images/Calender 2.svg" alt="">
            <span>تاریخ انتشار :</span>
            <span> ۱۴۰۲/۰۳/۱۲</span>
        </div>
        <img class="arrow2" src="./assets/images/Arrow - Down Square (2).svg" alt="">
        <div class="left-info">
            <img src="./assets/images/Time Circle 2.svg" alt="">
            <span>زمان مطالعه :</span>
            <span>15 دقیقه </span>
        </div>
    </div>

<div class="small-box">
    <span class="title">عرضه ویندوز ۱۲ با هوش مصنوعی</span>
    <p class="desc">ویندوز ۱۱ به‌لطف هوش مصنوعی قرار است تغییراتی قابل‌توجه به خود ببیند...</p>
</div>

</body>

</html>
