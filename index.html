<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>دیجی نیوز</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <img class="hero-bg" src="./images/bg.svg" alt="">


        <div class="container header-content">

            <div class="right">
                <img src="./images/Vector.png" alt="">
                <span class="logo">دیجی نیوز</span>
            </div>

            <div class="left">
                <button class="btn outline">وارد شوید</button>
                <button class="btn primary">ثبت نام</button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">

        <div class="container hero-content">
            <h1>به دیجی نیوز خوش آمدید</h1>
            <p>اینجا جدیدترین مطالب حوزه تکنولوژی قرار داده می‌شود</p>

            <div class="categories">
                <button class="category">موبایل</button>
                <button class="category">کامپیوتر</button>
                <button class="category">سخت افزار</button>
                <button class="category">سیستم عامل</button>
                <button class="category">بررسی ویدیویی</button>

                <button class="category active">مشاهده همه</button>

            </div>
        </div>
    </section>

</body>

</html>
